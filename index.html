(function(){
  'use strict';
  var CHANNEL='skripsi-magang-bridge-v60';
  var pending=new Map();
  var CSV_CACHE_KEY='portal_csv_snapshot_v62';
  var csvSnapshot={headers:[],rows:[],fetchedAt:0,error:''};
  try{
    var cachedCsv=JSON.parse(localStorage.getItem(CSV_CACHE_KEY)||'null');
    if(cachedCsv&&Array.isArray(cachedCsv.headers)&&Array.isArray(cachedCsv.rows))csvSnapshot=cachedCsv;
  }catch(_){ }

  function apiUrl(){return String(window.PORTAL_CONFIG.SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/portal-api';}
  async function request(payload,timeout){
    var key=String(window.PORTAL_CONFIG.SUPABASE_ANON_KEY||'').trim();
    if(!key||key.indexOf('PASTE_')===0)throw new Error('SUPABASE_ANON_KEY belum diisi di index.html.');
    payload=Object.assign({},payload||{},{clientVersion:String(window.PORTAL_CONFIG.VERSION||'')});
    var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},Number(timeout)||30000);
    try{
      var token=String(payload.token||'').trim();
      var response=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+(token||key)},body:JSON.stringify(payload),signal:controller.signal,cache:'no-store'});
      var result=await response.json().catch(function(){return null;});
      if(!response.ok)throw new Error(result&&result.message||('Supabase HTTP '+response.status));
      return result||{ok:false,message:'Respons backend kosong.'};
    }catch(err){if(err&&err.name==='AbortError')throw new Error('Koneksi Supabase melewati batas waktu.');throw err;}finally{clearTimeout(timer);}
  }
  function parseCsv(text){
    var rows=[],row=[],field='',quoted=false;
    text=String(text||'').replace(/^\uFEFF/,'');
    for(var i=0;i<text.length;i++){
      var ch=text[i],next=text[i+1];
      if(ch==='"'&&quoted&&next==='"'){field+='"';i++;continue;}
      if(ch==='"'){quoted=!quoted;continue;}
      if(ch===','&&!quoted){row.push(field);field='';continue;}
      if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(field);if(row.some(function(v){return v!=='';}))rows.push(row);row=[];field='';continue;}
      field+=ch;
    }
    row.push(field);if(row.some(function(v){return v!=='';}))rows.push(row);
    var headers=rows.shift()||[];
    return {headers:headers,rows:rows.map(function(values){var out={};headers.forEach(function(h,j){out[h||('kolom_'+(j+1))]=values[j]||'';});return out;})};
  }
  async function refreshCsv(){
    var url=String(window.PORTAL_CONFIG.CSV_URL||'').trim();

      var response=await fetch(url,{method:'GET',cache:'no-store',credentials:'omit',redirect:'follow'});

      var parsed=parseCsv(await response.text());
      csvSnapshot={headers:parsed.headers,rows:parsed.rows,fetchedAt:Date.now(),error:''};
      try{var raw=JSON.stringify(csvSnapshot);if(raw.length<3000000)localStorage.setItem(CSV_CACHE_KEY,raw);}catch(_){ }
    }catch(err){csvSnapshot=Object.assign({},csvSnapshot,{error:err&&err.message||String(err)});}
    window.dispatchEvent(new CustomEvent('portal:csv',{detail:csvSnapshot}));
    return csvSnapshot;
  }
  window.PortalBridge={request:request,refreshCsv:refreshCsv,getCsvSnapshot:function(){return csvSnapshot;},getApiUrl:apiUrl};
  setTimeout(function(){refreshCsv();},0);
})();
</script>

     Dipasang sebelum script portal besar sehingga tombol Masuk tetap berfungsi
     walaupun modul lain gagal dievaluasi. -->
<script>
(function(){
  'use strict';
  var loginBtn=document.getElementById('loginBtn');
  var loginForm=document.getElementById('loginForm');
  var loginId=document.getElementById('loginIdentifier');
  var loginPw=document.getElementById('loginPassword');
  var noticeBox=document.getElementById('authNotice');
  if(!loginBtn||!loginForm||!loginId||!loginPw||!noticeBox)return;

  function showNotice(message,type){
    noticeBox.textContent=message||'';
    noticeBox.className=message?('notice show '+(type||'error')):'notice';
  }
  function setBusy(on){
    window.__portalLoginBusyV52=!!on;
    loginBtn.disabled=!!on;
    loginBtn.textContent=on?'Memeriksa akun…':'Masuk';
  }
  function parse(raw){
    if(raw&&typeof raw==='object')return raw;
    try{return JSON.parse(String(raw||'{}'));}
    catch(e){return {ok:false,message:'Respons login dari server tidak dapat dibaca.'};}
  }
  function quickEnter(result){
    try{
      var boot=result&&result.boot||{};
      var user=boot.user||{};
      var app=document.getElementById('app');
      var login=document.getElementById('loginPage');
      var content=document.getElementById('content');
      var nav=document.getElementById('nav');
      function setText(id,text){var el=document.getElementById(id);if(el)el.textContent=text||'';}
      var expiresAt=Number(result&&result.sessionExpiresAt)||Date.now()+24*60*60*1000;
      try{localStorage.setItem('portal_v60_token',String(result.token||''));localStorage.setItem('portal_v60_boot',JSON.stringify(boot));localStorage.setItem('portal_v60_page','dashboard');localStorage.setItem('portal_v60_expires',String(expiresAt));}catch(_){
        try{sessionStorage.setItem('portal_v60_token',String(result.token||''));sessionStorage.setItem('portal_v60_boot',JSON.stringify(boot));sessionStorage.setItem('portal_v60_page','dashboard');sessionStorage.setItem('portal_v60_expires',String(expiresAt));}catch(__){}
      }
      setText('brandTitle',(boot.config&&boot.config.APP_TITLE)||(boot.app&&boot.app.name)||'Skripsi & Magang');
      setText('brandOrg',(boot.config&&boot.config.INSTITUTION_NAME)||'');
      setText('academicYear','Tahun akademik '+((boot.config&&boot.config.ACADEMIC_YEAR)||'2026/2027'));
      setText('version','v'+((boot.app&&boot.app.version)||'6.30.0'));
      setText('userName',user.name||user.username||'Pengguna');
      var roles={admin:'Admin / Prodi',lecturer:'Dosen',student:'Mahasiswa',monitor:'Monitor / Rekap'};
      setText('userRole',roles[user.role_id]||user.role_id||'');
      setText('avatar',String(user.name||user.username||'U').charAt(0).toUpperCase());
      setText('pageTitle','Dashboard');
      if(nav){
        var icons={dashboard:'⌂',supervisor:'♟',guidance:'▤',documents:'▱',proposal_seminar:'◫',thesis_exam:'▦',letters:'✉',internship:'▣',profile:'◎',admin:'⚙'};
        nav.innerHTML=(boot.nav||[]).filter(function(n){return n&&n.id!=='reviews'}).map(function(n){
          var id=String(n.id||'').replace(/[^a-z0-9_-]/gi,'');
          var label=String(n.label||id).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]});
          return '<button type="button" data-page="'+id+'"'+(id==='dashboard'?' class="active"':'')+'><span class="ico">'+(icons[id]||'•')+'</span><span class="navlabel">'+label+'</span></button>';
        }).join('');
      }
      if(content)content.innerHTML='<section class="hero"><h3>Login berhasil</h3><p>Portal siap digunakan. Dashboard dimuat lebih dulu; menu lain tetap dapat langsung diklik kapan saja.</p></section><div class="card" style="margin-top:14px"><div class="hint">Fast Login v4.7 aktif. Tombol memakai direct binding; tidak bergantung pada satu event-router global.</div></div>';
      if(app)app.classList.remove('hidden');
      if(login)login.classList.add('hidden');
      return true;
    }catch(e){
      showNotice('Login berhasil, tetapi shell portal gagal ditampilkan: '+(e.message||String(e)),'error');
      return false;
    }
  }
  function handoff(result,attempt){
    if(typeof window.__portalAcceptLoginV52==='function'){
      try{window.__portalAcceptLoginV52(result);return;}
      catch(e){console.error(e);}
    }
    if((attempt||0)<100)setTimeout(function(){handoff(result,(attempt||0)+1);},100);
  }
  function deliver(result){
    if(!result||!result.ok){
      setBusy(false);
      showNotice((result&&result.message)||'Username atau password salah.','error');
      return;
    }
    window.__pendingPortalLoginV52=result;
    quickEnter(result);
    setBusy(false);
    handoff(result,0);
  }
  function fail(err){
    setBusy(false);
    showNotice('Login gagal terhubung ke server: '+((err&&err.message)||String(err||'unknown error')),'error');
  }
  function directLogin(ev){
    if(ev){ev.preventDefault();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();else if(ev.stopPropagation)ev.stopPropagation();}
    if(window.__portalLoginBusyV52)return false;
    var identifier=String(loginId.value||'').trim();
    var password=String(loginPw.value||'');
    showNotice('');
    if(!identifier||!password){showNotice('Username dan password wajib diisi.','error');return false;}
    setBusy(true);
    if(!window.PortalBridge||typeof window.PortalBridge.request!=='function'){
      fail(new Error('Jembatan API frontend belum siap. Muat ulang halaman.'));
      return false;
    }
    window.PortalBridge.request({action:'auth.login',identifier:identifier,password:password},30000)
      .then(function(raw){deliver(parse(raw));})
      .catch(fail);
    return false;
  }

  // Tiga jalur input, seluruhnya langsung terikat ke fungsi kecil ini.
  loginBtn.addEventListener('click',directLogin,true);
  loginForm.addEventListener('submit',directLogin,true);
  loginPw.addEventListener('keydown',function(ev){if(ev.key==='Enter')directLogin(ev);},true);
  window.portalLoginV52=directLogin;
  function updateCsvStatus(d){var el=document.getElementById('csvStatus');d=d||{};if(el)el.textContent=(d.rows||[]).length?('CSV siap · '+d.rows.length+' baris'):(d.error?'CSV belum dapat dibaca':'memeriksa CSV…')}
  window.addEventListener('portal:csv',function(ev){updateCsvStatus(ev&&ev.detail||{})});
  if(window.PortalBridge?.getCsvSnapshot)updateCsvStatus(window.PortalBridge.getCsvSnapshot());
  // v4.7: INTERACTION BOOTSTRAP. Tidak memakai satu document-click router.
  // Setiap elemen interaktif mendapat onclick langsung. Jika modul utama belum
  // selesai, tombol inti (sidebar/logout/refresh) tetap mempunyai fallback.
  function fallbackAction(action,el,ev){
    if(ev){ev.preventDefault();ev.stopPropagation();}
    if(typeof window.__portalActionRouterV52==='function'){
      return window.__portalActionRouterV52(action,el,ev);
    }
    if(action==='sidebar-toggle'||action==='mobile-menu'){
      var app=document.getElementById('app'), side=document.getElementById('sidebar');
      if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches){if(side)side.classList.toggle('mobile-open');return;}
      if(app){app.classList.toggle('collapsed');try{localStorage.setItem('portal_v60_collapsed',app.classList.contains('collapsed')?'1':'0');}catch(_){}}
      return;
    }
    if(action==='refresh'){
      if(typeof window.__portalRefreshV52==='function')return window.__portalRefreshV52();
      try{location.reload();}catch(_){}
      return;
    }
    if(action==='logout'){
      try{['portal_v60_token','portal_v60_boot','portal_v60_page','portal_v60_admin','portal_v60_collapsed','portal_v60_expires'].forEach(function(k){localStorage.removeItem(k);sessionStorage.removeItem(k);});}catch(_){}
      try{location.reload();}catch(_){}
      return;
    }
    window.__pendingPortalActionsV52=window.__pendingPortalActionsV52||[];
    window.__pendingPortalActionsV52.push({action:action,el:el});
  }
  function fallbackBind(root){
    if(window.__portalMainReadyV52&&typeof window.__bindPortalDomV52==='function')return window.__bindPortalDomV52(root||document);
    var scope=root&&root.querySelectorAll?root:document;
    var items=[];
    if(scope.matches&&(scope.matches('[data-page]')||scope.matches('[data-admin-tab]')||scope.matches('[data-action]')))items.push(scope);
    if(scope.querySelectorAll)items=items.concat(Array.from(scope.querySelectorAll('[data-page],[data-admin-tab],[data-action]')));
    items.forEach(function(el){
      if(el.dataset&&el.dataset.fallbackBoundV52==='1')return;
      if(el.dataset)el.dataset.fallbackBoundV52='1';
      el.onclick=function(ev){
        var page=el.getAttribute('data-page');
        if(page!==null){ev.preventDefault();if(typeof window.__portalPageRouterV52==='function')return window.__portalPageRouterV52(page);window.__pendingPortalPageV52=page;var c=document.getElementById('content');if(c)c.innerHTML='<div class="card"><h3>Menyiapkan '+page+'…</h3><p class="hint">Menyiapkan halaman…</p></div>';return;}
        var tab=el.getAttribute('data-admin-tab');
        if(tab!==null){ev.preventDefault();if(typeof window.__portalAdminTabRouterV52==='function')return window.__portalAdminTabRouterV52(tab);window.__pendingPortalAdminTabV52=tab;return;}
        var action=el.getAttribute('data-action');if(action!==null)return fallbackAction(action,el,ev);
      };
    });
  }
  window.__portalFallbackBindV52=fallbackBind;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){fallbackBind(document);},{once:true});else fallbackBind(document);
  try{new MutationObserver(function(ms){ms.forEach(function(m){Array.from(m.addedNodes||[]).forEach(function(n){if(n&&n.nodeType===1)fallbackBind(n);});});}).observe(document.documentElement,{childList:true,subtree:true});}catch(_){ }
  window.__portalLoginBootstrapReadyV52=true;
})();
</script>

const DOCUMENT_REALTIME_INTERVAL_V620=60000;
function periodDateTimeV624(value){
 const text=String(value||'').trim(),match=text.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?$/);if(!match)return text;
 const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 return `${match[3]} ${months[Number(match[2])-1]||match[2]} ${match[1]} ${match[4]||'00'}:${match[5]||'00'}:${match[6]||'00'} WIB`;
}
function periodNoteHtml(period){if(!period)return'';const range=[period.start?periodDateTimeV624(period.start):'',period.end?periodDateTimeV624(period.end):''].filter(Boolean).join(' – ');return `<div class="period-note"><b>${esc(period.label||'Periode')}</b>: ${range?esc(range):'tidak dibatasi'} · <span class="badge ${period.open?'ACTIVE':'REJECTED'}">${period.open?'Dibuka':'Ditutup'}</span>${period.message?`<br>${esc(period.message)}`:''}</div>`}

 $('content').innerHTML=h;startDocumentsRealtimeV620();
}
function documentComposerBusyV620(){return !!S.cache.documentFormOpen||!!$('dFile')?.files?.length}
function setDocumentLiveStatusV620(message,state=''){
 const el=$('documentLiveStatus');if(!el)return;el.textContent=message;el.className='live-sync'+(state?' '+state:'');
}
function stopDocumentsRealtimeV620(){clearTimeout(startDocumentsRealtimeV620._timer);startDocumentsRealtimeV620._timer=0}
function startDocumentsRealtimeV620(delay=DOCUMENT_REALTIME_INTERVAL_V620){
 stopDocumentsRealtimeV620();if(!S.token||S.page!=='documents')return;
 startDocumentsRealtimeV620._timer=setTimeout(pollDocumentsRealtimeV620,Math.max(1000,Number(delay)||DOCUMENT_REALTIME_INTERVAL_V620));
}
async function pollDocumentsRealtimeV620(){
 startDocumentsRealtimeV620._timer=0;
 if(!S.token||S.page!=='documents')return;
 if(document.hidden||documentComposerBusyV620()||pollDocumentsRealtimeV620._busy){startDocumentsRealtimeV620();return;}
 pollDocumentsRealtimeV620._busy=true;setDocumentLiveStatusV620('Memeriksa perubahan dokumen…','syncing');
 try{
   const result=await api('getDocumentsRealtime',S.cache.documentRevisionV620||'');
   pollDocumentsRealtimeV620._failures=0;
   if(!S.token||S.page!=='documents')return;
   if(result?.revision)S.cache.documentRevisionV620=String(result.revision);
   if(result?.changed&&Array.isArray(result.documents)){
     const base=S.cache.documentBundleV620||S.workspace.pages?.documents||{};
     const next=Object.assign({},base,{documents:result.documents,document_revision:result.revision||''});
     S.workspace.pages=S.workspace.pages||{};S.workspace.pageSynced=S.workspace.pageSynced||{};S.workspace.pages.documents=next;S.workspace.pageSynced.documents=Date.now();S.cache.documentBundleV620=next;scheduleDurableSaveV61();
     if(!documentComposerBusyV620()){renderDocuments(next);rememberViewV52('documents',next);}
   }
   const checked=result?.checked_at?dt(result.checked_at):new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
   setDocumentLiveStatusV620('Tersinkron · '+checked);
 }catch(e){pollDocumentsRealtimeV620._failures=(pollDocumentsRealtimeV620._failures||0)+1;console.warn('Sinkron dokumen:',e?.message||e);setDocumentLiveStatusV620('Server sibuk · mencoba lagi bertahap','error');}
 finally{pollDocumentsRealtimeV620._busy=false;startDocumentsRealtimeV620(realtimeDelayV627(DOCUMENT_REALTIME_INTERVAL_V620,pollDocumentsRealtimeV620._failures||0));}
}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

  if(scope.querySelectorAll)nodes=nodes.concat(Array.from(scope.querySelectorAll('[data-page],[data-admin-tab],[data-action]')));
  nodes.forEach(el=>{
    if(!el||!el.getAttribute)return;
    el.dataset.boundV52='1';
    el.onclick=function(ev){
      if(ev){ev.preventDefault();ev.stopPropagation();}

    };
  });
}
